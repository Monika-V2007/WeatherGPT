<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD166"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sun Circle -->
  <circle cx="38" cy="38" r="18" fill="url(#sunGrad)" filter="url(#glow)"/>
  
  <!-- Sun Rays (Sparkle accents) -->
  <path d="M 38 12 L 38 16 M 38 60 L 38 64 M 12 38 L 16 38 M 60 38 L 64 38" stroke="#FFD166" stroke-width="3" stroke-linecap="round"/>

  <!-- AI Sparkle Icon Top Right -->
  <path d="M 72 20 Q 72 30 82 30 Q 72 30 72 40 Q 72 30 62 30 Q 72 30 72 20 Z" fill="url(#bgGrad)"/>
  <path d="M 82 45 Q 82 50 87 50 Q 82 50 82 55 Q 82 50 77 50 Q 82 50 82 45 Z" fill="#00F0FF"/>

  <!-- Main Cloud -->
  <path d="M 30 68 
           C 22 68, 16 62, 16 54 
           C 16 47, 21 41, 28 40 
           C 31 32, 39 27, 48 27 
           C 58 27, 66 34, 68 43 
           C 74 44, 78 49, 78 55 
           C 78 62, 72 68, 64 68 Z" 
        fill="url(#cloudGrad)" />
</svg>
